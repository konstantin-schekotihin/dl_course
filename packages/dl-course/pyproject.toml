[project]
name = "dl-course"
# Placeholder: the publish workflow sets a date-based version (YYYY.M.D.RUN) before each upload.
version = "0.0.0"
description = "Plotting and asset helpers for the AAU Machine Learning and Deep Learning course notebooks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Konstantin Schekotihin" }]
# No dependencies on purpose: notebooks run in the course .venv or in Google Colab, which already
# provide numpy, pandas, matplotlib, seaborn, scipy, torch and scikit-learn. Declaring them would
# make `pip install` in Colab upgrade or reinstall these packages.
dependencies = []

[project.urls]
Repository = "https://github.com/konstantin-schekotihin/dl_course"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dl_course"]

# RISE slideshow settings for all course notebooks. Installed into <env>/etc/jupyter/nbconfig/rise.d/,
# which Jupyter Notebook reads automatically (notebook metadata would still override these).
[tool.hatch.build.targets.wheel.shared-data]
"jupyter-config/nbconfig/rise.d/dl-course.json" = "etc/jupyter/nbconfig/rise.d/dl-course.json"
