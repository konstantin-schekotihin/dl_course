# Publishes the course helper package (packages/dl-course) to PyPI whenever it changes on master.
# Colab notebooks install it with `%pip install -q dl-course`, so they always get the latest version.
#
# Authentication uses PyPI trusted publishing (no API token stored in GitHub). One-time setup on
# https://pypi.org/manage/account/publishing/ -> "Add a new pending publisher":
#   PyPI project name: dl-course | Owner: konstantin-schekotihin | Repository: dl_course
#   Workflow name: publish-dl-course.yml | Environment: pypi
name: Publish dl-course

on:
  push:
    branches: [master]
    paths: ["packages/dl-course/**"]
  workflow_dispatch:

jobs:
  # Colab always installs the newest version, so a broken helper would break every Colab notebook
  # at once: never publish without the smoke test passing.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]  # course .venv and Google Colab
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # setup-uv publishes exact version tags only
      - name: Install the package and the libraries the helpers use
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install ./packages/dl-course numpy pandas matplotlib seaborn scipy scikit-learn networkx pillow ipython
      - name: Smoke test
        run: .venv/bin/python packages/dl-course/tests/smoke_test.py

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # setup-uv publishes exact version tags only
      # PyPI never accepts the same version twice, so each run gets a unique date-based version.
      - name: Set version
        run: uv version --project packages/dl-course --frozen "$(date -u +%Y.%-m.%-d).${{ github.run_number }}"
      - name: Build
        run: uv build packages/dl-course --out-dir dist
      - name: Publish
        run: uv publish dist/*
